# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "touch-display-layer"
BBFILE_PATTERN_touch-display-layer := "^${LAYERDIR}/"
BBFILE_PRIORITY_touch-display-layer = "20"

LAYERVERSION_touch-display-layer = "1"
# gnome-layer (meta-openembedded/meta-gnome) needs networking-layer; gnome-shell needs pipewire from multimedia-layer.
# object-detection-layer: the image we build on.
LAYERDEPENDS_touch-display-layer = "core openembedded-layer networking-layer multimedia-layer gnome-layer raspberrypi object-detection-layer"
LAYERSERIES_COMPAT_touch-display-layer = "scarthgap"

# meta-raspberrypi only builds and copies the overlays it lists onto the boot partition; without this,
# the dtoverlay=piscreen line in config.txt (rpi-config bbappend) is silently ignored.
RPI_KERNEL_DEVICETREE_OVERLAYS:append = " overlays/piscreen.dtbo"
