# NetworkManager on the touch display image (meta-touch-display).
# It manages Wi-Fi (wlan0) only, so the Wi-Fi menu in GNOME works; the wired port stays with systemd-networkd
# (80-wired.network), which keeps a cable as a fallback way in over SSH.
[main]
# DNS goes through systemd-resolved, like the rest of the system (/etc/resolv.conf points to it).
dns=systemd-resolved

[keyfile]
unmanaged-devices=except:interface-name:wlan0
