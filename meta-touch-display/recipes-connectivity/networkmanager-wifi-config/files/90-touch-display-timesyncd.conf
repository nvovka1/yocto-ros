[Time]
# NetworkManager runs Wi-Fi here, and unlike systemd-networkd it does not hand the router's time servers to
# systemd-timesyncd, so name one.
NTP=pool.ntp.org
# The Pi has no clock battery: until the first sync the date is months behind, and every HTTPS certificate looks
# invalid (GNOME Web: "Unacceptable TLS certificate"). The first try right after Wi-Fi connects can fail, and the
# default retry is 30 s later; retry sooner so the clock is right before the browser is opened.
ConnectionRetrySec=5
