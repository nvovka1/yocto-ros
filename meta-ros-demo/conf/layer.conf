# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "ros-demo-layer"
BBFILE_PATTERN_ros-demo-layer := "^${LAYERDIR}/"
# Higher than meta-ros (10-12) so our recipes and bbappends win.
BBFILE_PRIORITY_ros-demo-layer = "20"

LAYERVERSION_ros-demo-layer = "1"
LAYERDEPENDS_ros-demo-layer = "core rpi-base-layer ros-common-layer ros2-layer"
LAYERSERIES_COMPAT_ros-demo-layer = "scarthgap"

# Root of this git repository, so recipes can fetch sources from ros2_ws/src.
YOCTO_ROS_REPOSITORY_ROOT := "${LAYERDIR}/.."
