# Base Raspberry Pi 5 OS: SSH, Wi-Fi, Python, tools. Formerly the local.conf block from docs/01.
BBPATH .= ":${LAYERDIR}"

BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "rpi-base-layer"
BBFILE_PATTERN_rpi-base-layer := "^${LAYERDIR}/"
BBFILE_PRIORITY_rpi-base-layer = "15"

LAYERVERSION_rpi-base-layer = "1"
LAYERDEPENDS_rpi-base-layer = "core raspberrypi openembedded-layer meta-python"
LAYERSERIES_COMPAT_rpi-base-layer = "scarthgap"
