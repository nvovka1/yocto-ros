# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "buzzer-layer"
BBFILE_PATTERN_buzzer-layer := "^${LAYERDIR}/"
BBFILE_PRIORITY_buzzer-layer = "20"

LAYERVERSION_buzzer-layer = "1"
# object-detection-layer: the image we build on, and the node that publishes /object_distance.
LAYERDEPENDS_buzzer-layer = "core raspberrypi ros-common-layer ros2-layer ros-demo-layer object-detection-layer"
LAYERSERIES_COMPAT_buzzer-layer = "scarthgap"

# meta-raspberrypi only builds and copies the overlays it lists onto the boot partition; without this,
# the dtoverlay=pwm-2chan line in config.txt (rpi-config bbappend) is silently ignored.
RPI_KERNEL_DEVICETREE_OVERLAYS:append = " overlays/pwm-2chan.dtbo"
