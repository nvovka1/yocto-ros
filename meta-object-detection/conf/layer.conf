# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "object-detection-layer"
BBFILE_PATTERN_object-detection-layer := "^${LAYERDIR}/"
BBFILE_PRIORITY_object-detection-layer = "20"

LAYERVERSION_object-detection-layer = "1"
# ros-demo-layer: the ROS 2 image we build on, ros-setup-profile, and YOCTO_ROS_REPOSITORY_ROOT.
LAYERDEPENDS_object-detection-layer = "core openembedded-layer raspberrypi ros-common-layer ros2-layer ros-demo-layer"
LAYERSERIES_COMPAT_object-detection-layer = "scarthgap"
